# Tagged-release builds for VisIVO Visual Analytics.
#
# Triggers
#   - push of a tag matching v* (e.g. v0.0.3) → builds + attaches to the GitHub release
#   - workflow_dispatch                       → manual run for testing the pipeline
#
# Outputs (per matrix entry)
#   - macOS arm64: VisIVOVisualAnalytics-macos-arm64.dmg
#   - macOS x86_64: VisIVOVisualAnalytics-macos-x86_64.dmg
#                  contains: VisIVOVisualAnalytics.app + Setup Backend.command
#   - Linux x86_64: VisIVOVisualAnalytics-linux-x86_64.tar.gz
#                   contains: *.AppImage + setup_backend.sh + requirements.txt
#   - Windows x86_64: VisIVOVisualAnalytics-windows-x86_64.zip
#                     contains: bin/<exe + DLLs + plugins/ + backend/>
#                              + setup_backend.bat + requirements.txt
#
# The Python backend code is bundled next to the executable:
#   - macOS:   <App>.app/Contents/Resources/backend/
#   - Linux:   <AppDir>/usr/bin/backend/  (inside the AppImage)
#   - Windows: bin\backend\
#
# A self-contained Python runtime (python-build-standalone) with the backend's
# dependencies already installed ships WITH it, so a release runs on a machine
# that has no Python at all:
#   - macOS:   <App>.app/Contents/Resources/python/   (inside the bundle)
#   - Linux:   <pkg>/python/   BESIDE the AppImage — the AppImage is a
#              read-only squashfs and linuxdeploy rewrites what it finds in the
#              AppDir, so the runtime is kept out of it; the client resolves it
#              from $APPIMAGE's directory
#   - Windows: bin\python\
#
# The setup scripts remain, now optional: they build a venv in a writable
# user-data location, which BackendLauncher PREFERS over the bundled runtime.
# That is the supported way to add optional extras (cupy, an LLM SDK):
#   - macOS:   ~/Library/Application Support/VisIVO/.venv
#   - Linux:   ${XDG_DATA_HOME:-~/.local/share}/VisIVO/.venv
#   - Windows: %APPDATA%\VisIVO\.venv
#
# Builds are unsigned — internal-tester distribution only.
# First run is slow (~45–60 min for VTK); subsequent runs hit the cache.

name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  QT_VERSION: '6.10.1'
  # Relocatable CPython shipped inside the release so a user needs no Python of
  # their own. python-build-standalone is the same runtime uv installs; the
  # "install_only" flavour is a self-contained tree that can be moved anywhere.
  PY_RUNTIME_VERSION: '3.12.8'
  PY_RUNTIME_TAG: '20241219'
  VTK_VERSION: '9.5.0'
  CFITSIO_VERSION: '4.6.3'  # Linux: built from source. macOS: from Homebrew.

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
            py_triple: x86_64-unknown-linux-gnu
          # Runner labels checked against actions/runner-images: macos-13 has been
          # retired and macos-14 is deprecated, so both would fail or age out.
          # ubuntu-22.04 is kept deliberately — the oldest supported glibc makes
          # the most portable AppImage.
          - os: macos-15
            name: macos-arm64
            qt_host: mac
            qt_arch: clang_64
            py_triple: aarch64-apple-darwin
          # Intel Macs: a separate runner, not a universal binary — VTK is built
          # from source per runner and lipo-ing two VTK trees is far more work
          # than one more matrix entry.
          - os: macos-15-intel
            name: macos-x86_64
            qt_host: mac
            qt_arch: clang_64
            py_triple: x86_64-apple-darwin
          - os: windows-2022
            name: windows-x86_64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            py_triple: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── System dependencies ──────────────────────────────────────────────
      # ── Self-contained Python runtime ────────────────────────────────────
      # The release ships its own interpreter with the backend's dependencies
      # already installed. Before this, a tester had to have Python 3.11+ and
      # run a setup script that pip-installed ~1 GB of scientific wheels over
      # the network — which fails on a stock Mac (Apple ships 3.9), on a locked
      # -down Windows box, and on any machine without a working toolchain.
      #
      # python-build-standalone's "install_only" tree is relocatable: it can be
      # copied into an .app bundle or a zip and still run.
      #
      # This runs FIRST, before Qt and the hour-long VTK build, because the two
      # things that can go wrong here — a release asset that moved, a dependency
      # with no wheel for this platform — are worth finding in three minutes.
      - name: Build self-contained Python runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/astral-sh/python-build-standalone/releases/download"
          URL="$BASE/${PY_RUNTIME_TAG}/cpython-${PY_RUNTIME_VERSION}+${PY_RUNTIME_TAG}-${{ matrix.py_triple }}-install_only.tar.gz"
          echo "Fetching $URL"
          curl -fsSL -o pyruntime.tar.gz "$URL"
          rm -rf pyruntime && mkdir pyruntime
          tar -xzf pyruntime.tar.gz -C pyruntime   # creates pyruntime/python/
          if [ -x pyruntime/python/bin/python3 ]; then
            PY=pyruntime/python/bin/python3
          else
            PY=pyruntime/python/python.exe          # Windows layout
          fi
          "$PY" -VV
          "$PY" -m pip install --upgrade pip wheel
          # --only-binary=:all: keeps a missing wheel a loud failure here rather
          # than a silent source build that works on the runner and not on the
          # user's machine.
          "$PY" -m pip install --only-binary=:all: -r backend/requirements.txt
          # Trim what no end user needs. pip stays: the copilot's optional SDKs
          # and a user's own extras are installed into this same tree.
          find pyruntime -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find pyruntime -name '*.pyc' -delete 2>/dev/null || true
          rm -rf pyruntime/python/lib/python*/test pyruntime/python/lib/python*/idlelib \
                 pyruntime/python/lib/python*/tkinter pyruntime/python/lib/python*/turtledemo \
                 2>/dev/null || true
          "$PY" -B -c "import fastapi, uvicorn, numpy, astropy, vtk, scipy, pandas; print('runtime imports OK')"
          du -sh pyruntime || true

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          # Same guard as tests.yml: the runner image's Chrome / Microsoft apt
          # sources are unused here and a stale index on either aborts the
          # update (Hash Sum mismatch), failing the release for no local reason.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome* \
                     /etc/apt/sources.list.d/*microsoft* \
                     /etc/apt/sources.list.d/*azure-cli* || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxcb1-dev \
            libfontconfig1 libdbus-1-3 \
            libnss3 libxdamage1 libxrandr2 libasound2 libxcomposite1 \
            file

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        # Homebrew's cfitsio ships the CMake config (CFITSIO::cfitsio target)
        # the project's CMakeLists expects. vcpkg's port exports as
        # `unofficial-cfitsio` with a different target name, so don't use it.
        run: brew install ninja cfitsio

      # MSVC 2022 ships with the windows-2022 runner image but the env vars
      # (PATH to cl.exe, INCLUDE, LIB, …) need to be activated for every step.
      # ilammy/msvc-dev-cmd does it once and persists the env to the rest of
      # the job. Ninja is also bundled with VS 2022.
      - name: Setup MSVC env (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Qt 6.10 (cached by the action) ──────────────────────────────────
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          # The list must cover every component CMakeLists.txt asks for that is
          # NOT in qtbase — checked against `qt_components` there:
          #   WebSockets      -> qtwebsockets   (WebRTC signalling for remote render)
          #   NetworkAuth     -> qtnetworkauth
          #   WebEngineWidgets-> qtwebengine (+ qtwebchannel, its dependency)
          # Concurrent, Widgets, Xml, Svg, Network and PrintSupport ship in qtbase.
          # qtserialport is pulled in by the qtpositioning NMEA plugin that
          # linuxdeploy-plugin-qt tries to bundle; without it the deploy fails
          # with "Could not find dependency: libQt6SerialPort.so.6".
          modules: 'qtwebengine qtwebchannel qtwebsockets qtpositioning qtnetworkauth qtserialport'
          cache: true

      # ── cfitsio on Linux: built from source (cached). The upstream CMake
      #    build exports the CFITSIO::cfitsio target the project expects.
      #    On macOS we use Homebrew's cfitsio (installed above) which ships
      #    the same config — no separate step needed.
      # cfitsio's CMake build requires ZLIB. Linux gets it from apt; macOS has
      # it in the SDK. Windows MSVC has neither, so we build zlib from source
      # first and feed its install prefix to cfitsio.
      - name: Restore zlib install (Windows)
        if: runner.os == 'Windows'
        id: cache-zlib
        uses: actions/cache/restore@v4
        with:
          path: zlib-install
          key: zlib-1.3.1-${{ matrix.os }}-v1

      - name: Build zlib from source (Windows)
        if: runner.os == 'Windows' && steps.cache-zlib.outputs.cache-hit != 'true'
        shell: bash
        run: |
          WS="$(pwd -W 2>/dev/null || pwd)"
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$WS/zlib-install"
          cmake --build zlib-build --parallel
          cmake --install zlib-build

      - name: Save zlib install (Windows)
        if: runner.os == 'Windows' && steps.cache-zlib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: zlib-install
          key: zlib-1.3.1-${{ matrix.os }}-v1

      - name: Restore cfitsio install (Linux/Windows)
        if: runner.os != 'macOS'
        id: cache-cfitsio
        uses: actions/cache/restore@v4
        with:
          path: cfitsio-install
          key: cfitsio-${{ env.CFITSIO_VERSION }}-${{ matrix.os }}-v2

      - name: Build cfitsio from source (Linux/Windows)
        if: runner.os != 'macOS' && steps.cache-cfitsio.outputs.cache-hit != 'true'
        shell: bash
        run: |
          WS="$(pwd -W 2>/dev/null || pwd)"
          curl -fsSL -o cfitsio.tar.gz \
            "https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/cfitsio-${CFITSIO_VERSION}.tar.gz"
          mkdir cfitsio-src
          tar -xzf cfitsio.tar.gz --strip-components=1 -C cfitsio-src
          # On Windows, point CMake at our locally-built zlib.
          ZLIB_PREFIX_ARG=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ZLIB_PREFIX_ARG="-DCMAKE_PREFIX_PATH=$WS/zlib-install"
          fi
          cmake -S cfitsio-src -B cfitsio-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DUSE_BZIP2=OFF \
            -DUSE_CURL=OFF \
            -DTESTS=OFF \
            -DUTILS=OFF \
            $ZLIB_PREFIX_ARG \
            -DCMAKE_INSTALL_PREFIX="$WS/cfitsio-install"
          cmake --build cfitsio-build --parallel
          cmake --install cfitsio-build

      - name: Save cfitsio install (Linux/Windows)
        if: runner.os != 'macOS' && steps.cache-cfitsio.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cfitsio-install
          key: cfitsio-${{ env.CFITSIO_VERSION }}-${{ matrix.os }}-v2

      # ── VTK 9.5 (built from source, cached) ─────────────────────────────
      # restore + save as SEPARATE steps, deliberately. actions/cache writes in a
      # post-job step that does not run when the job fails — and this job fails
      # AFTER VTK is built (a compile error in our own code, a packaging slip),
      # so the hour-long VTK build was being thrown away and redone on every
      # attempt. Saving immediately after the build persists it whatever happens
      # later, which is the difference between a 15-minute retry and an
      # 80-minute one.
      - name: Restore VTK install tree
        id: cache-vtk
        uses: actions/cache/restore@v4
        with:
          path: vtk-install
          key: vtk-${{ env.VTK_VERSION }}-qt${{ env.QT_VERSION }}-${{ matrix.os }}-${{ matrix.qt_arch }}-macos13-v2

      - name: Build VTK from source
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          WS="$(pwd -W 2>/dev/null || pwd)"
          git clone --depth 1 --branch v${{ env.VTK_VERSION }} \
            https://gitlab.kitware.com/vtk/vtk.git vtk-src
          # macOS refuses to launch a binary on an OS older than the one that
          # BUILT it, so without a deployment target every dependency inherits
          # the runner image's version and the release silently stops working
          # for anyone who has not upgraded. 13.0 is Qt 6.11's own floor. The
          # app sets the same value in CMakeLists.txt; it has to be set here
          # too, or VTK alone raises the bundle's floor back up.
          cmake -S vtk-src -B vtk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DVTK_BUILD_EXAMPLES=OFF \
            -DVTK_GROUP_ENABLE_Qt=YES \
            -DVTK_QT_VERSION=6 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_INSTALL_PREFIX="$WS/vtk-install"
          cmake --build vtk-build --parallel
          cmake --install vtk-build

      # Same key as the restore above — they have to match literally, because a
      # workflow-level env var cannot reference `matrix`.
      - name: Save VTK install tree
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vtk-install
          key: vtk-${{ env.VTK_VERSION }}-qt${{ env.QT_VERSION }}-${{ matrix.os }}-${{ matrix.qt_arch }}-macos13-v2

      # ── Configure & build the desktop client ─────────────────────────────
      - name: Diagnose VTK install layout (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "=== Top-level vtk-install/ ==="
          ls -la vtk-install/ || echo "(missing)"
          echo "=== lib/ ==="
          ls -la vtk-install/lib/ 2>/dev/null || echo "(no lib/)"
          echo "=== lib/cmake/ ==="
          ls -la vtk-install/lib/cmake/ 2>/dev/null || echo "(no lib/cmake/)"
          echo "=== Where are the *.cmake config files? ==="
          find vtk-install -name '*-config.cmake' -o -name '*Config.cmake' 2>/dev/null | head -20
          echo "=== Cache hit? ==="
          echo "VTK cache hit: ${{ steps.cache-vtk.outputs.cache-hit }}"

      - name: Configure
        shell: bash
        run: |
          # On Windows, Git Bash $PWD returns POSIX paths (/d/a/…) that CMake
          # mishandles when joined with ';' in CMAKE_PREFIX_PATH. `pwd -W` is a
          # Git Bash extension that yields Windows-native paths (D:/a/…). On
          # Linux/macOS it fails; fall back to plain pwd.
          WS="$(pwd -W 2>/dev/null || pwd)"

          # CMAKE_PREFIX_PATH order: VTK first, then platform-specific cfitsio.
          # macOS: Homebrew's cfitsio (auto-detected via brew --prefix).
          # Linux/Windows: locally-built cfitsio install tree.
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            CFITSIO_PREFIX="$(brew --prefix cfitsio)"
          else
            CFITSIO_PREFIX="$WS/cfitsio-install"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$WS/vtk-install;$CFITSIO_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$WS/dist"

      - name: Build
        run: cmake --build build --parallel

      # ── macOS install + bundle ───────────────────────────────────────────
      - name: Install (deploys Qt frameworks via macdeployqt)
        if: runner.os == 'macOS'
        run: cmake --install build

      # qt_generate_deploy_app_script bundles Qt + libs whose dependencies
      # macdeployqt can resolve. VTK dylibs are referenced as @rpath/libvtk*.dylib
      # and macdeployqt -libpath doesn't reliably follow them, so we copy them
      # in manually and fix install_names ourselves. Then re-run macdeployqt to
      # pick up Qt deps of the VTK libs and re-sign.
      - name: Bundle VTK dylibs into the app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/VisIVOVisualAnalytics.app"
          FW="$APP/Contents/Frameworks"
          mkdir -p "$FW"

          # Copy real files + symlinks (cp -a preserves symlinks; cp -P avoids
          # following them). Match libvtk*.dylib and the per-version variants.
          shopt -s nullglob
          cp -aP vtk-install/lib/libvtk*.dylib* "$FW/"

          # Normalize each real (non-symlink) VTK dylib:
          #   - id  -> @rpath/<basename>
          #   - any non-@rpath libvtk*.dylib reference -> @rpath/<basename>
          for lib in "$FW"/libvtk*.dylib; do
            [ -L "$lib" ] && continue
            base="$(basename "$lib")"
            chmod u+w "$lib"
            install_name_tool -id "@rpath/$base" "$lib"
            # Rewrite VTK→VTK refs that still use absolute or build-time paths.
            otool -L "$lib" | awk 'NR>1 {print $1}' | \
              while read -r dep; do
                case "$dep" in
                  *libvtk*.dylib)
                    case "$dep" in
                      @rpath/*) ;;
                      *)
                        install_name_tool -change "$dep" \
                          "@rpath/$(basename "$dep")" "$lib"
                        ;;
                    esac
                    ;;
                esac
              done
          done

          # Re-run macdeployqt so it picks up VTK→Qt links, re-rewrites paths,
          # and re-signs everything in the bundle as a coherent unit.
          macdeployqt "$APP" -libpath="$PWD/vtk-install/lib" -verbose=1

      - name: Bundle Python backend (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BACKEND_DEST="dist/VisIVOVisualAnalytics.app/Contents/Resources/backend"
          mkdir -p "$BACKEND_DEST"
          cp -R backend/app "$BACKEND_DEST/"
          cp backend/__init__.py backend/requirements.txt "$BACKEND_DEST/"
          [ -f backend/pytest.ini ] && cp backend/pytest.ini "$BACKEND_DEST/" || true
          find "$BACKEND_DEST" -name __pycache__ -type d -prune -exec rm -rf {} +

          # The interpreter goes inside the bundle, so the .app in the DMG is
          # self-contained and nothing has to be installed next to it.
          cp -R pyruntime/python "dist/VisIVOVisualAnalytics.app/Contents/Resources/python"

      # Re-sign the whole bundle ad-hoc AFTER all modifications (Qt deploy +
      # backend copy + bundled interpreter). On Apple Silicon any tampering with a signed bundle
      # produces SIGKILL "Code Signature Invalid" at dyld load time.
      - name: Re-sign bundle ad-hoc (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=dist/VisIVOVisualAnalytics.app
          # --deep does NOT sign loose Mach-O files under Resources/ — Apple's
          # own documentation says so, and it seals them as resources instead.
          # The bundled interpreter is exactly that: an executable plus a few
          # thousand .so extensions living in Resources/python. Sign them
          # explicitly FIRST, innermost outwards, or the app is "valid" while
          # dyld refuses the extension modules.
          if [ -d "$APP/Contents/Resources/python" ]; then
            find "$APP/Contents/Resources/python" \
                 \( -name '*.so' -o -name '*.dylib' -o -path '*/bin/*' \) -type f -print0 \
              | xargs -0 -n 64 codesign --force --sign - 2>/dev/null || true
          fi
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Prove the bundled interpreter still runs after signing, from its
          # final place inside the bundle.
          # -B: without it this very check writes __pycache__ back into the bundle
          # it just signed, and the staging verification below rejects it.
          "$APP/Contents/Resources/python/bin/python3" -B -c "import vtk, numpy, astropy; print('bundled runtime OK after signing')"

      # Stage the .app together with the backend setup script in a folder,
      # then turn that folder into the DMG. Tester sees both side by side
      # when they mount the disk image.
      - name: Build DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          STAGE=dmg-staging
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          # ditto reproduces a signed bundle faithfully (extended attributes,
          # symlinked framework versions). The verification on the next line is
          # the actual guarantee — it is what caught a bundle whose signature had
          # been invalidated after signing.
          ditto dist/VisIVOVisualAnalytics.app "$STAGE/VisIVOVisualAnalytics.app"
          codesign --verify --deep --strict "$STAGE/VisIVOVisualAnalytics.app"
          cp scripts/setup_backend.command "$STAGE/Setup Backend.command"
          chmod +x "$STAGE/Setup Backend.command"
          cat > "$STAGE/README.txt" <<'README'
          VisIVO Visual Analytics
          =======================

          1. Drag VisIVOVisualAnalytics.app into /Applications.
          2. Launch it.

          There is no step 3: the app carries its own Python runtime with the
          backend's dependencies inside the bundle, so nothing is installed and
          the 3.9 that macOS ships is not used.

          If macOS refuses to open the app: right-click → Open, then confirm.
          (The bundle is ad-hoc signed, not notarized — internal-tester
          distribution.)

          "Setup Backend.command" is optional, and only for using your own
          Python instead: it builds a virtual environment in
              ~/Library/Application Support/VisIVO/.venv
          which the app prefers over the bundled runtime. That is also how to
          add optional extras (an LLM SDK for the copilot, a CUDA cupy).
          README
          hdiutil create \
            -volname "VisIVO Visual Analytics" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "VisIVOVisualAnalytics-${{ matrix.name }}.dmg"

      # ── Windows install + bundle + zip ───────────────────────────────────
      - name: Install + run windeployqt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # qt_generate_deploy_app_script triggers windeployqt on Windows during
          # cmake --install, copying Qt DLLs and platform plugins next to the .exe.
          cmake --install build

      - name: Bundle VTK + cfitsio DLLs and Python backend (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/bin"

          # qt_deploy_runtime_dependencies on Windows does NOT chase non-Qt
          # @rpath-equivalent refs into VTK/cfitsio/zlib; copy their DLLs
          # explicitly. Look in both bin/ (Windows convention) and lib/.
          for src in vtk-install/bin vtk-install/lib \
                     cfitsio-install/bin cfitsio-install/lib \
                     zlib-install/bin zlib-install/lib; do
            [ -d "$src" ] || continue
            cp -v "$src"/*.dll "$BIN/" 2>/dev/null || true
          done

          # Backend Python code next to the .exe
          BACKEND_DEST="$BIN/backend"
          mkdir -p "$BACKEND_DEST"
          cp -R backend/app "$BACKEND_DEST/"
          cp backend/__init__.py backend/requirements.txt "$BACKEND_DEST/"
          [ -f backend/pytest.ini ] && cp backend/pytest.ini "$BACKEND_DEST/" || true
          find "$BACKEND_DEST" -name __pycache__ -type d -prune -exec rm -rf {} +

          # Bundled interpreter next to the .exe (BackendLauncher looks here).
          cp -R pyruntime/python "$BIN/python"

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -x
          PKG="VisIVOVisualAnalytics-${{ matrix.name }}"
          rm -rf "$PKG"
          # Layout: <PKG>/bin/<exe + DLLs + plugins/ + backend/>
          #         <PKG>/setup_backend.bat
          #         <PKG>/requirements.txt
          #         <PKG>/README.txt
          mkdir -p "$PKG"
          cp -R dist/* "$PKG/"
          cp scripts/setup_backend.bat "$PKG/setup_backend.bat"
          cp backend/requirements.txt "$PKG/requirements.txt"
          cat > "$PKG/README.txt" <<README
          VisIVO Visual Analytics (Windows)
          =================================

          Just run it:

              bin\\VisIVOVisualAnalytics.exe

          SmartScreen will warn the first time (the build is unsigned): click
          "More info" -> "Run anyway".

          Nothing to install. This package carries its own Python runtime with
          the backend's dependencies in bin\\python.

          Note: healpy has no Windows wheels, so the HiPS tile-query endpoints
          are unavailable on this platform; everything else runs.

          Optional, only if you would rather use your own Python: run
          setup_backend.bat, which builds a virtual environment in
              %APPDATA%\VisIVO\.venv
          from requirements.txt. The client prefers that environment over the
          bundled one.
          README
          # PowerShell zip is reliable cross-runner; bash zip may be missing.
          powershell -Command "Compress-Archive -Path '$PKG' -DestinationPath '$PKG.zip' -Force"

      # ── Linux install + AppImage ─────────────────────────────────────────
      - name: Stage AppDir + bundle backend (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          cmake --install build --prefix "$APPDIR/usr"

          # Backend next to the executable
          BACKEND_DEST="$APPDIR/usr/bin/backend"
          mkdir -p "$BACKEND_DEST"
          cp -R backend/app "$BACKEND_DEST/"
          cp backend/__init__.py backend/requirements.txt "$BACKEND_DEST/"
          [ -f backend/pytest.ini ] && cp backend/pytest.ini "$BACKEND_DEST/" || true
          find "$BACKEND_DEST" -name __pycache__ -type d -prune -exec rm -rf {} +

          # Desktop entry + icon (linuxdeploy needs both)
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp icons/VisIVO_256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/visivo.png"
          cat > "$APPDIR/usr/share/applications/visivo.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=VisIVO Visual Analytics
          Exec=VisIVOVisualAnalytics
          Icon=visivo
          Categories=Science;Education;
          Terminal=false
          DESKTOP

      - name: Build AppImage with linuxdeploy
        if: runner.os == 'Linux'
        shell: bash
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/src
        run: |
          # linuxdeploy + Qt plugin (continuous releases — both single AppImages)
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          # linuxdeploy-plugin-qt picks qmake from $QMAKE or PATH; install-qt-action
          # puts qmake on PATH, so set QMAKE explicitly for robustness.
          export QMAKE="$(command -v qmake)"

          # linuxdeploy uses $LD_LIBRARY_PATH to resolve dylib dependencies
          # (it has no --library-path flag). Point it at VTK and cfitsio.
          export LD_LIBRARY_PATH="$PWD/vtk-install/lib:$PWD/cfitsio-install/lib:$PWD/cfitsio-install/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # GH runners don't have FUSE — extract and run instead
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir \
            --plugin qt \
            --output appimage \
            -e build/VisIVOVisualAnalytics \
            -d AppDir/usr/share/applications/visivo.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/visivo.png

      # Package the AppImage together with the backend setup script and
      # requirements.txt in a tar.gz. Tester extracts, runs setup_backend.sh
      # once, then runs the AppImage normally.
      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -x
          PKG="VisIVOVisualAnalytics-${{ matrix.name }}"
          rm -rf "$PKG"
          mkdir "$PKG"
          mv VisIVO*Visual*Analytics*.AppImage "$PKG/$PKG.AppImage"
          chmod +x "$PKG/$PKG.AppImage"
          cp scripts/setup_backend.sh "$PKG/setup_backend.sh"
          chmod +x "$PKG/setup_backend.sh"
          cp backend/requirements.txt "$PKG/requirements.txt"
          # The interpreter travels BESIDE the AppImage, not inside it: the
          # AppImage is a read-only squashfs and linuxdeploy rewrites what it
          # finds in the AppDir. The client resolves it from $APPIMAGE's
          # directory, so extracting the tarball is the whole installation.
          cp -R pyruntime/python "$PKG/python"
          cat > "$PKG/README.txt" <<README
          VisIVO Visual Analytics
          =======================

          Just run it:

              ./$PKG.AppImage

          Nothing to install. This package carries its own Python runtime with
          the backend's dependencies in ./python, and the client finds it next
          to the AppImage — so keep the two together when you move them.

          Optional, only if you would rather use your own Python: run
          ./setup_backend.sh, which builds a virtual environment in
             \$XDG_DATA_HOME/VisIVO/.venv  (default: ~/.local/share/VisIVO/.venv)
          from requirements.txt. The client prefers that environment over the
          bundled one, so it is also how you add optional extras (a CUDA build
          of cupy, an LLM SDK for the copilot).
          README
          tar -czf "$PKG.tar.gz" "$PKG"

      # The staging check ran before the runtime was copied, signed and packaged.
      # This one runs the interpreter from the place the user will actually get,
      # and imports the backend itself rather than a few libraries — the failures
      # worth catching here (a broken relocation, a signature dyld rejects, a
      # file the packager dropped) all survive the earlier check.
      - name: Smoke-test the packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            macOS)   PY="dmg-staging/VisIVOVisualAnalytics.app/Contents/Resources/python/bin/python3" ;;
            Windows) PY="VisIVOVisualAnalytics-${{ matrix.name }}/bin/python/python.exe" ;;
            Linux)   PY="VisIVOVisualAnalytics-${{ matrix.name }}/python/bin/python3" ;;
          esac
          PYABS="$PWD/$PY"                      # the check below runs from $BE
          echo "interpreter: $PYABS"
          "$PYABS" -VV
          # Import the backend app from the bundled backend sources, the way the
          # launcher will.
          case "${{ runner.os }}" in
            macOS)   BE="dmg-staging/VisIVOVisualAnalytics.app/Contents/Resources/backend" ;;
            Windows) BE="VisIVOVisualAnalytics-${{ matrix.name }}/bin/backend" ;;
            Linux)   BE="" ;;   # inside the AppImage; not reachable from here
          esac
          if [ -n "$BE" ]; then
            ( cd "$BE" && "$PYABS" -B -c "import app.main; print('backend imports OK')" )
          else
            "$PYABS" -B -c "import fastapi, uvicorn, vtk, numpy, astropy; print('runtime OK')"
          fi

      # ── Upload + attach to release ───────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisIVOVisualAnalytics-${{ matrix.name }}
          path: |
            VisIVOVisualAnalytics-*.dmg
            VisIVOVisualAnalytics-*.tar.gz
            VisIVOVisualAnalytics-*.zip
          if-no-files-found: error

  # Single release-publishing job that runs once after the whole matrix is
  # complete. Doing the upload inside each matrix job races on the same release
  # via the Releases API and produces "HttpError: Server Error" intermittently.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp -v {} release/ \;
          ls -la release/

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
