# Tagged-release builds for VisIVO Visual Analytics.
#
# Triggers
#   - push of a tag matching v* (e.g. v0.0.3) → builds + attaches to the GitHub release
#   - workflow_dispatch                       → manual run for testing the pipeline
#
# Outputs (per matrix entry)
#   - macOS:  VisIVOVisualAnalytics-macos-{x86_64,arm64}.dmg
#                contains: VisIVOVisualAnalytics.app + Setup Backend.command
#   - Linux:  VisIVOVisualAnalytics-linux-x86_64.tar.gz
#                contains: <name>.AppImage + setup_backend.sh + requirements.txt
#
# The Python backend code is bundled next to the executable:
#   - macOS:  <App>.app/Contents/Resources/backend/
#   - Linux:  <AppDir>/usr/bin/backend/  (inside the AppImage)
#
# The Python venv is NOT bundled — testers run the setup script once, which
# creates a venv in a writable user-data location:
#   - macOS:  ~/Library/Application Support/VisIVO/.venv
#   - Linux:  ${XDG_DATA_HOME:-~/.local/share}/VisIVO/.venv
# The BackendLauncher in the desktop client picks it up automatically.
#
# Builds are unsigned — internal-tester distribution only.
# First run is slow (~45–60 min for VTK); subsequent runs hit the cache.

name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  QT_VERSION: '6.10.1'
  VTK_VERSION: '9.5.0'
  CFITSIO_VERSION: '4.6.3'  # Linux: built from source. macOS: from Homebrew.

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: macos-13
            name: macos-x86_64
            qt_host: mac
            qt_arch: clang_64
          - os: macos-14
            name: macos-arm64
            qt_host: mac
            qt_arch: clang_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── System dependencies ──────────────────────────────────────────────
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxcb1-dev \
            libfontconfig1 libdbus-1-3 \
            libnss3 libxdamage1 libxrandr2 libasound2 libxcomposite1 \
            file

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        # Homebrew's cfitsio ships the CMake config (CFITSIO::cfitsio target)
        # the project's CMakeLists expects. vcpkg's port exports as
        # `unofficial-cfitsio` with a different target name, so don't use it.
        run: brew install ninja cfitsio

      # ── Qt 6.10 (cached by the action) ──────────────────────────────────
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          # qtserialport is pulled in by the qtpositioning NMEA plugin that
          # linuxdeploy-plugin-qt tries to bundle; without it the deploy fails
          # with "Could not find dependency: libQt6SerialPort.so.6".
          modules: 'qtwebengine qtwebchannel qtpositioning qtnetworkauth qtserialport'
          cache: true

      # ── cfitsio on Linux: built from source (cached). The upstream CMake
      #    build exports the CFITSIO::cfitsio target the project expects.
      #    On macOS we use Homebrew's cfitsio (installed above) which ships
      #    the same config — no separate step needed.
      - name: Cache cfitsio install (Linux)
        if: runner.os == 'Linux'
        id: cache-cfitsio
        uses: actions/cache@v4
        with:
          path: cfitsio-install
          key: cfitsio-${{ env.CFITSIO_VERSION }}-${{ matrix.os }}-v1

      - name: Build cfitsio from source (Linux)
        if: runner.os == 'Linux' && steps.cache-cfitsio.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o cfitsio.tar.gz \
            "https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/cfitsio-${CFITSIO_VERSION}.tar.gz"
          mkdir cfitsio-src
          tar -xzf cfitsio.tar.gz --strip-components=1 -C cfitsio-src
          cmake -S cfitsio-src -B cfitsio-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DUSE_BZIP2=OFF \
            -DUSE_CURL=OFF \
            -DTESTS=OFF \
            -DUTILS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/cfitsio-install"
          cmake --build cfitsio-build --parallel
          cmake --install cfitsio-build

      # ── VTK 9.5 (built from source, cached) ─────────────────────────────
      - name: Cache VTK install tree
        id: cache-vtk
        uses: actions/cache@v4
        with:
          path: vtk-install
          key: vtk-${{ env.VTK_VERSION }}-qt${{ env.QT_VERSION }}-${{ matrix.os }}-${{ matrix.qt_arch }}-v1

      - name: Build VTK from source
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v${{ env.VTK_VERSION }} \
            https://gitlab.kitware.com/vtk/vtk.git vtk-src
          cmake -S vtk-src -B vtk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DVTK_BUILD_EXAMPLES=OFF \
            -DVTK_GROUP_ENABLE_Qt=YES \
            -DVTK_QT_VERSION=6 \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/vtk-install"
          cmake --build vtk-build --parallel
          cmake --install vtk-build

      # ── Configure & build the desktop client ─────────────────────────────
      - name: Configure
        shell: bash
        run: |
          # CMAKE_PREFIX_PATH order: VTK first, then platform-specific cfitsio.
          # macOS: Homebrew's cfitsio (auto-detected via brew --prefix).
          # Linux: locally-built cfitsio install tree.
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            CFITSIO_PREFIX="$(brew --prefix cfitsio)"
          else
            CFITSIO_PREFIX="$PWD/cfitsio-install"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/vtk-install;$CFITSIO_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist"

      - name: Build
        run: cmake --build build --parallel

      # ── macOS install + bundle ───────────────────────────────────────────
      - name: Install (deploys Qt frameworks via macdeployqt)
        if: runner.os == 'macOS'
        run: cmake --install build

      # qt_generate_deploy_app_script bundles Qt + libs whose dependencies
      # macdeployqt can resolve. VTK dylibs are referenced as @rpath/libvtk*.dylib
      # and macdeployqt -libpath doesn't reliably follow them, so we copy them
      # in manually and fix install_names ourselves. Then re-run macdeployqt to
      # pick up Qt deps of the VTK libs and re-sign.
      - name: Bundle VTK dylibs into the app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/VisIVOVisualAnalytics.app"
          FW="$APP/Contents/Frameworks"
          mkdir -p "$FW"

          # Copy real files + symlinks (cp -a preserves symlinks; cp -P avoids
          # following them). Match libvtk*.dylib and the per-version variants.
          shopt -s nullglob
          cp -aP vtk-install/lib/libvtk*.dylib* "$FW/"

          # Normalize each real (non-symlink) VTK dylib:
          #   - id  -> @rpath/<basename>
          #   - any non-@rpath libvtk*.dylib reference -> @rpath/<basename>
          for lib in "$FW"/libvtk*.dylib; do
            [ -L "$lib" ] && continue
            base="$(basename "$lib")"
            chmod u+w "$lib"
            install_name_tool -id "@rpath/$base" "$lib"
            # Rewrite VTK→VTK refs that still use absolute or build-time paths.
            otool -L "$lib" | awk 'NR>1 {print $1}' | \
              while read -r dep; do
                case "$dep" in
                  *libvtk*.dylib)
                    case "$dep" in
                      @rpath/*) ;;
                      *)
                        install_name_tool -change "$dep" \
                          "@rpath/$(basename "$dep")" "$lib"
                        ;;
                    esac
                    ;;
                esac
              done
          done

          # Re-run macdeployqt so it picks up VTK→Qt links, re-rewrites paths,
          # and re-signs everything in the bundle as a coherent unit.
          macdeployqt "$APP" -libpath="$PWD/vtk-install/lib" -verbose=1

      - name: Bundle Python backend (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BACKEND_DEST="dist/VisIVOVisualAnalytics.app/Contents/Resources/backend"
          mkdir -p "$BACKEND_DEST"
          cp -R backend/app "$BACKEND_DEST/"
          cp backend/__init__.py backend/requirements.txt "$BACKEND_DEST/"
          [ -f backend/pytest.ini ] && cp backend/pytest.ini "$BACKEND_DEST/" || true
          find "$BACKEND_DEST" -name __pycache__ -type d -prune -exec rm -rf {} +

      # Re-sign the whole bundle ad-hoc AFTER all modifications (Qt deploy +
      # backend copy). On Apple Silicon any tampering with a signed bundle
      # produces SIGKILL "Code Signature Invalid" at dyld load time.
      - name: Re-sign bundle ad-hoc (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - dist/VisIVOVisualAnalytics.app
          codesign --verify --deep --strict --verbose=2 dist/VisIVOVisualAnalytics.app

      # Stage the .app together with the backend setup script in a folder,
      # then turn that folder into the DMG. Tester sees both side by side
      # when they mount the disk image.
      - name: Build DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          STAGE=dmg-staging
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R dist/VisIVOVisualAnalytics.app "$STAGE/"
          cp scripts/setup_backend.command "$STAGE/Setup Backend.command"
          chmod +x "$STAGE/Setup Backend.command"
          cat > "$STAGE/README.txt" <<'README'
          VisIVO Visual Analytics — first-time setup
          ==========================================

          1. Drag VisIVOVisualAnalytics.app into /Applications.
          2. Double-click "Setup Backend.command" to install the Python
             backend (requires Python 3.11+ on the system).
             This creates a venv at:
                 ~/Library/Application Support/VisIVO/.venv
          3. Launch VisIVOVisualAnalytics from /Applications.

          If macOS refuses to open the app or the script:
             right-click → Open, then confirm. (The bundle is ad-hoc
             signed, not notarized — internal-tester distribution.)
          README
          hdiutil create \
            -volname "VisIVO Visual Analytics" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "VisIVOVisualAnalytics-${{ matrix.name }}.dmg"

      # ── Linux install + AppImage ─────────────────────────────────────────
      - name: Stage AppDir + bundle backend (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          cmake --install build --prefix "$APPDIR/usr"

          # Backend next to the executable
          BACKEND_DEST="$APPDIR/usr/bin/backend"
          mkdir -p "$BACKEND_DEST"
          cp -R backend/app "$BACKEND_DEST/"
          cp backend/__init__.py backend/requirements.txt "$BACKEND_DEST/"
          [ -f backend/pytest.ini ] && cp backend/pytest.ini "$BACKEND_DEST/" || true
          find "$BACKEND_DEST" -name __pycache__ -type d -prune -exec rm -rf {} +

          # Desktop entry + icon (linuxdeploy needs both)
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp icons/VisIVO_256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/visivo.png"
          cat > "$APPDIR/usr/share/applications/visivo.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=VisIVO Visual Analytics
          Exec=VisIVOVisualAnalytics
          Icon=visivo
          Categories=Science;Education;
          Terminal=false
          DESKTOP

      - name: Build AppImage with linuxdeploy
        if: runner.os == 'Linux'
        shell: bash
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/src
        run: |
          # linuxdeploy + Qt plugin (continuous releases — both single AppImages)
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          # linuxdeploy-plugin-qt picks qmake from $QMAKE or PATH; install-qt-action
          # puts qmake on PATH, so set QMAKE explicitly for robustness.
          export QMAKE="$(command -v qmake)"

          # linuxdeploy uses $LD_LIBRARY_PATH to resolve dylib dependencies
          # (it has no --library-path flag). Point it at VTK and cfitsio.
          export LD_LIBRARY_PATH="$PWD/vtk-install/lib:$PWD/cfitsio-install/lib:$PWD/cfitsio-install/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # GH runners don't have FUSE — extract and run instead
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir \
            --plugin qt \
            --output appimage \
            -e build/VisIVOVisualAnalytics \
            -d AppDir/usr/share/applications/visivo.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/visivo.png

      # Package the AppImage together with the backend setup script and
      # requirements.txt in a tar.gz. Tester extracts, runs setup_backend.sh
      # once, then runs the AppImage normally.
      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -x
          PKG="VisIVOVisualAnalytics-${{ matrix.name }}"
          rm -rf "$PKG"
          mkdir "$PKG"
          mv VisIVO*Visual*Analytics*.AppImage "$PKG/$PKG.AppImage"
          chmod +x "$PKG/$PKG.AppImage"
          cp scripts/setup_backend.sh "$PKG/setup_backend.sh"
          chmod +x "$PKG/setup_backend.sh"
          cp backend/requirements.txt "$PKG/requirements.txt"
          cat > "$PKG/README.txt" <<README
          VisIVO Visual Analytics — first-time setup
          ==========================================

          1. ./setup_backend.sh
             Installs the Python backend in:
                \$XDG_DATA_HOME/VisIVO/.venv  (default: ~/.local/share/VisIVO/.venv)
             Requires Python 3.11+ with the venv module
             (Debian/Ubuntu: sudo apt install python3 python3-venv python3-pip).

          2. ./$PKG.AppImage
             Launches the desktop client; it will pick up the venv created
             in step 1 automatically.
          README
          tar -czf "$PKG.tar.gz" "$PKG"

      # ── Upload + attach to release ───────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisIVOVisualAnalytics-${{ matrix.name }}
          path: |
            VisIVOVisualAnalytics-*.dmg
            VisIVOVisualAnalytics-*.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VisIVOVisualAnalytics-*.dmg
            VisIVOVisualAnalytics-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: false
