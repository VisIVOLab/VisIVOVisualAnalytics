# VisIVO VR pairing service behind Apache httpd 2.4.47 or later.
# Goes inside the <VirtualHost *:443> that serves the loader, in place of
# the plain "ProxyPass /pair/ ..." line. Modules: proxy, proxy_http,
# reqtimeout and headers (all in Debian's apache2 package; a2enmod them).
# The service listens on 127.0.0.1:8765 with VR_PAIR_TRUST_PROXY=1.
#
# Why the limits matter on a shared server: Apache holds one worker thread
# for each open WebSocket for as long as it lasts, and a backend's host
# connection lasts for hours. Without "max", the pairing service could take
# every worker of this server and stop the other sites (measured with
# tools/attack_harness.py --apache: 20 WebSockets took all 20 workers and a
# static page of another site timed out; with these lines it answered at
# once and the extra WebSockets got 503).

# One line per path, so that each has its own pool of connections to the
# service: backends (host) and headsets (join) cannot crowd each other out.
# Only paths under these three prefixes reach the service (it answers 404
# to anything but the exact ones); the rest of /pair/ is answered by Apache.
#   upgrade=websocket    tunnel the WebSocket after the upgrade (2.4.47+).
#   timeout=120          a tunnel silent this long is closed; the service
#                        pings every 20 s, so live connections never are.
#   connectiontimeout=5  give up quickly when the service is down.
#   max=N                connections to the service per Apache child
#                        process (Debian's event MPM: MaxRequestWorkers 150 /
#                        ThreadsPerChild 25 = up to 6 children). Here at most
#                        6 x (8 + 4) = 72 tunnels, under half the workers.
#                        "max" x children is also how many backends can be
#                        connected at once: raise MaxRequestWorkers (and
#                        ServerLimit) before raising "max".
#   acquire=50           when the pool is full, answer 503 after 50 ms
#                        instead of holding a worker while waiting.
ProxyPass "/pair/v1/host" "http://127.0.0.1:8765/v1/host" upgrade=websocket timeout=120 connectiontimeout=5 max=8 acquire=50
ProxyPass "/pair/v1/join" "http://127.0.0.1:8765/v1/join" upgrade=websocket timeout=120 connectiontimeout=5 max=4 acquire=50
ProxyPass "/pair/healthz" "http://127.0.0.1:8765/healthz" timeout=5 connectiontimeout=5 max=2 acquire=50

# X-Forwarded-For is appended by mod_proxy (ProxyAddHeaders, on by default):
# the service takes its last entry, the address Apache saw, so a client
# that sends its own X-Forwarded-For does not change it. X-Real-IP is only
# read when X-Forwarded-For is missing; drop any a client sends anyway.
# If mod_remoteip is enabled on this server (apache2ctl -M | grep remoteip),
# the appended address is whatever it accepted: make sure its trusted
# proxies are right, or clients may choose their address for the limits.
ProxyAddHeaders On
RequestHeader unset X-Real-IP early

<LocationMatch "^/pair/">
    # The upgrade and the health check are GETs: refuse every other method.
    <LimitExcept GET>
        Require all denied
    </LimitExcept>
    # A GET has no body. Covers the request only, not the WebSocket frames
    # after the upgrade (the service limits those: 64 KiB a message).
    LimitRequestBody 1024
</LocationMatch>

# Slow clients (mod_reqtimeout): the TLS handshake within 5 s, the request
# headers within 10 s (up to 20 s while they arrive at 500 bytes/s or more),
# so a client cannot hold a worker by sending its headers a byte at a time.
# Debian's reqtimeout.conf sets similar server-wide values; these hold for
# this virtual host whatever the global ones are.
RequestReadTimeout handshake=5 header=10-20,MinRate=500 body=10,MinRate=500

# Optional, server-wide, needs the third-party mod_qos (libapache2-mod-qos):
# connections per client address over all virtual hosts.
#   QS_SrvMaxConnPerIP 50
