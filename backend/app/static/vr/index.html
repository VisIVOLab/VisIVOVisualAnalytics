<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisIVO VR</title>
<meta name="visivo-vr-build" content="__VR_BUILD__">
<link rel="stylesheet" href="b/__VR_BUILD__/style.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="notice" role="alert" hidden>
  <strong id="notice-title"></strong>
  <div id="notice-body"></div>
  <div id="notice-actions" class="row"></div>
</div>

<aside id="panel">
  <header>
    <strong>VisIVO VR</strong>
    <span id="xr-status" class="muted">checking WebXR…</span>
    <button id="toggle-panel" title="Hide or show this panel">⇔</button>
  </header>

  <section id="connect">
    <label>Backend token
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="paste the token, or open the page with #token=…">
    </label>
    <label class="inline"><input id="remember" type="checkbox"> remember on this device</label>
  </section>

  <section id="data">
    <label>Cube on the backend
      <input id="path" type="text" spellcheck="false" placeholder="/path/to/cube.fits">
    </label>
    <div class="row">
      <button id="browse">Browse…</button>
      <button id="synthetic" title="A generated cube, no backend needed">Synthetic</button>
      <select id="synthetic-size">
        <option>128</option><option selected>256</option><option>384</option><option>512</option>
      </select>
    </div>
    <ul id="files" hidden></ul>
    <div class="row">
      <label>Spatial bin <select id="fxy">
        <option value="0" selected>auto</option><option>1</option><option>2</option><option>3</option>
        <option>4</option><option>6</option><option>8</option></select></label>
      <label>Spectral bin <select id="fz">
        <option value="0" selected>auto</option><option>1</option><option>2</option><option>4</option></select></label>
    </div>
    <div class="row">
      <label>Binning <select id="mode">
        <option value="mean" selected>mean</option><option value="max">max</option></select></label>
      <label>Texture <select id="encoding">
        <option value="uint8" selected>8-bit</option><option value="float16">16-bit float</option></select></label>
      <label>Max side <select id="maxdim">
        <option>128</option><option selected>256</option><option>384</option><option>512</option></select></label>
    </div>
    <div class="row">
      <label title="Where the backend reads the reduced cube from: a level of the cube's brick pyramid (built first if missing) or a pass over the whole cube. Auto: the pyramid for a cube the backend draws out of core, binned by the mean.">Read from <select id="source">
        <option value="auto" selected>auto</option><option value="pyramid">brick pyramid</option>
        <option value="cube">whole cube</option></select></label>
    </div>
    <button id="load" class="primary">Open and load</button>
    <div id="load-status" class="muted"></div>
  </section>

  <section id="layers"></section>

  <section id="view">
    <label>Threshold <span id="thr-value" class="value"></span>
      <input id="thr" type="range" min="0" max="1000" value="100"></label>
    <div class="row">
      <label>from <select id="thr-source">
        <option value="reduced" selected>for this binning</option>
        <option value="cube">full cube (as on the desktop)</option></select></label>
      <button id="thr-reset">Reset</button>
    </div>
    <label>Colour max <span id="cmax-value" class="value"></span>
      <input id="cmax" type="range" min="1" max="1000" value="1000"></label>
    <div class="row">
      <label>Colour map <select id="cmap"></select></label>
      <label>Stretch <select id="gamma">
        <option value="1">linear</option><option value="0.5" selected>sqrt</option><option value="0.3">strong</option></select></label>
    </div>
    <label>Opacity <input id="opacity" type="range" min="1" max="200" value="40"></label>
    <div class="row">
      <label>Render <select id="rmode">
        <option value="0" selected>emission</option><option value="1">max intensity</option></select></label>
      <label>Samples / voxel <select id="spv">
        <option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label>
    </div>
    <div class="row">
      <label class="inline"><input id="skip" type="checkbox" checked> empty-space skipping</label>
      <label class="inline"><input id="governor" type="checkbox" checked> hold the frame rate</label>
    </div>
    <label>Velocity stretch <span id="zs-value" class="value"></span>
      <input id="zstretch" type="range" min="10" max="400" value="100"></label>
    <details>
      <summary>Clipping box</summary>
      <div id="clip"></div>
    </details>
  </section>

  <section id="refinement">
    <div class="row">
      <label class="inline" title="While the view is still or slow, full-quality frames rendered by the backend on the whole cube are blended in"><input id="refine" type="checkbox" checked> refine with the backend's full cube</label>
    </div>
    <div class="row">
      <label>Refined size <select id="refine-scale">
        <option value="0.4">0.4×</option><option value="0.6">0.6×</option><option value="0.8">0.8×</option><option value="1" selected>1×</option></select></label>
      <label>JPEG <select id="refine-quality">
        <option>70</option><option>85</option><option selected>95</option></select></label>
      <label class="inline" title="Off: the frame is moved as a plane through the cube's centre"><input id="refine-depth" type="checkbox" checked> reproject with depth</label>
    </div>
  </section>

  <section id="selection">
    <div class="row">
      <label title="What a click (or the headset's trigger) does: Explore pins the readout, Select runs the tool, Clip moves the velocity slab">Mode <select id="ui-mode">
        <option value="explore" selected>Explore</option><option value="select">Select</option><option value="clip">Clip</option></select></label>
      <label>Selection tool <select id="sel-tool">
        <option value="probe" selected>spectrum probe</option><option value="lasso">Kinematic Lasso</option>
        <option value="box">box region</option></select></label>
      <button id="sel-clear" title="Remove the selection and the marks">Clear</button>
    </div>
    <div class="row">
      <label>Seed at <select id="sel-seedat">
        <option value="peak" selected>brightest along the ray</option><option value="hit">first drawn sample</option></select></label>
      <label class="inline"><input id="sel-snap" type="checkbox" checked> brightest voxel of its block</label>
    </div>
    <details>
      <summary>Kinematic Lasso parameters (the desktop's defaults)</summary>
      <div class="row">
        <label>Reach <input id="lasso-reach" type="number" min="1" max="64" step="1" value="8"></label>
        <label>Velocity coupling <input id="lasso-lambda" type="number" min="0.1" max="5" step="0.05" value="1"></label>
        <label>Threshold (σ) <input id="lasso-nsigma" type="number" min="0.5" max="10" step="0.1" value="2.5"></label>
      </div>
      <div class="row">
        <label>Smoothing <select id="lasso-smooth">
          <option value="0,0" selected>off</option><option value="1,3">(1, 3, 3)</option>
          <option value="2,4">(2, 4, 4)</option><option value="2,6">(2, 6, 6)</option></select></label>
        <label>Noise σ <input id="lasso-sigma" type="number" min="0" step="any" value="0"
          title="0: the service measures it (robust, whole cube), as the desktop does without a noise estimate"></label>
      </div>
    </details>
    <div id="sel-panel"></div>
    <div class="row">
      <button id="sel-export" disabled>Download recipes (.json)</button>
      <button id="sel-copy" disabled>Copy last recipe</button>
    </div>
    <div id="sel-recipes" class="muted"></div>
  </section>

  <section id="xr">
    <div class="row">
      <label>Resolution <select id="fbscale">
        <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label>
      <label>Foveation <select id="foveation">
        <option value="0">off</option><option value="0.5">low</option><option value="1" selected>high</option></select></label>
      <label>Refresh <select id="rate">
        <option>72</option><option selected>90</option><option>120</option></select></label>
    </div>
    <div class="row">
      <label class="inline" title="The menu and the result windows the headset shows, in this view, used with the mouse (?panel3d)"><input id="panel3d" type="checkbox"> show the headset's menu here</label>
    </div>
    <div class="row">
      <label class="inline" title="The left hand points and acts, the right hand holds the menu (kept in this browser)"><input id="left-handed" type="checkbox"> left-handed</label>
      <label class="inline" title="What each button does now, next to the controllers (kept in this browser)"><input id="labels" type="checkbox" checked> labels by the controllers</label>
    </div>
    <div class="row">
      <button id="enter-vr" class="primary" disabled>Enter VR</button>
      <button id="enter-ar" disabled title="Passthrough: the cube in your room">Enter passthrough</button>
      <button id="bench-xr" disabled title="Synthetic cubes of four sizes at three sampling rates">Run the headset benchmark</button>
    </div>
  </section>

  <section id="help">
    <div class="row">
      <button id="show-guide" title="The controls in the headset, shown at the first entry into VR">Controls guide</button>
      <button id="copy-diag" title="Versions, GPU limits, settings and the last errors, for a support request">Copy diagnostics</button>
    </div>
    <div id="guide-text" class="muted" hidden></div>
    <pre id="diag-out" hidden></pre>
    <div class="row">
      <label class="inline" title="One sample a second (frame rate, missed frames, pose→frame, the link) and the session's events, stored by the backend as one file per record (?record in the address starts it)"><input id="record" type="checkbox"> record measurements</label>
      <button id="measure-run" title="The loaded cube through fixed conditions (reduced cube only, refinement over JPEG, over WebRTC video), each with timed phases and prompts">Run measurement protocol</button>
      <label class="inline" title="The two refined conditions again with refined frames at 0.6×"><input id="measure-second" type="checkbox"> also at 0.6× refined size</label>
    </div>
    <div id="measure-status" class="muted"></div>
  </section>

  <section id="stats">
    <pre id="cursor-readout" class="muted" title="Under the mouse: sky position, velocity, the value drawn there"></pre>
    <pre id="hud-text"></pre>
    <div id="scale-text" class="muted"></div>
    <pre id="bench-out" hidden></pre>
    <button id="bench-copy" hidden>Copy benchmark results</button>
  </section>
</aside>

<script type="module" src="b/__VR_BUILD__/js/main.js"></script>
</body>
</html>
