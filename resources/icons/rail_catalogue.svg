<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Table outline -->
  <rect x="3" y="5" width="18" height="14" rx="1.5"
        stroke="#8AB8CC" stroke-width="1.5"/>
  <!-- Header row divider (accent) -->
  <line x1="3" y1="10" x2="21" y2="10"
        stroke="#048ABF" stroke-width="1.5"/>
  <!-- Column divider -->
  <line x1="11" y1="10" x2="11" y2="19"
        stroke="#8AB8CC" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Body row -->
  <line x1="3" y1="14.5" x2="21" y2="14.5"
        stroke="#8AB8CC" stroke-width="1" stroke-opacity="0.4"/>
</svg>
